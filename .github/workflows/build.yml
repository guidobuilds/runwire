name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: scout-macos-arm64
          - target: bun-darwin-x64
            artifact: scout-macos-x64
          - target: bun-linux-x64
            artifact: scout-linux-x64
          - target: bun-linux-arm64
            artifact: scout-linux-arm64
          - target: bun-windows-x64
            artifact: scout-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      # Web build (packages/web) is embedded into the binary from M6 onward (Bun.embeddedFiles); M4 serves packages/web/dist from disk via `scout serve`, so this workflow compiles the CLI standalone until then (see docs/PLAN.md M6).
      - name: Compile ${{ matrix.target }}
        run: bun build --compile --target=${{ matrix.target }} --outfile=dist/${{ matrix.artifact }} ./apps/scout/src/index.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
